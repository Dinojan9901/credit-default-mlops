apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-default-api
  labels:
    app.kubernetes.io/name: credit-default-api
    app.kubernetes.io/part-of: credit-default
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-default-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the desired replica count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credit-default-api
        app.kubernetes.io/part-of: credit-default
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # The image tag is set by kustomize (kustomization.yaml / `kustomize edit set image`).
          image: credit-default-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_DIR       # model baked into the image (Dockerfile target api-with-model)
              value: /opt/model
            - name: MODEL_LOAD_RETRY_SECONDS
              value: "0"            # baked model: fail fast, let Kubernetes restart the pod
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # The server only listens once the model is loaded (imports + deserialising take
          # ~5 s on a normal machine, but >60 s on a CPU-starved laptop running kind). The
          # startup probe gives it up to 5 min and holds back liveness until then, so a
          # slow start isn't mistaken for a hung process and killed in a restart loop.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5       # default is 1 s - too tight on a busy node
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health      # 503 until a model is loaded -> no traffic before then
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
