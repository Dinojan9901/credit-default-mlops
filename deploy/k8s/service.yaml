apiVersion: v1
kind: Service
metadata:
  name: credit-default-api
  labels:
    app.kubernetes.io/name: credit-default-api
    app.kubernetes.io/part-of: credit-default
spec:
  # NodePort so the kind port mapping (30080 -> localhost:30080) works; on a real cluster
  # this would be ClusterIP behind an Ingress / Gateway.
  type: NodePort
  selector:
    app.kubernetes.io/name: credit-default-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: credit-default-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: credit-default-api
