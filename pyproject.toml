[project]
name = "credit-default"
version = "0.1.0"
description = "End-to-end MLOps pipeline for a credit-card default classifier: training, tracking, registry, serving, CI/CD/CT and monitoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow-skinny>=3.1",
    "skops>=0.10",  # secure (non-pickle) sklearn model format used by MLflow
    "pydantic>=2.8",
]

[project.optional-dependencies]
train = [
    "mlflow>=3.1",
    "optuna>=4.0",
    "shap>=0.46",
    "matplotlib>=3.9",
    "xlrd>=2.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.21",
]
monitor = [
    "evidently>=0.7",
]

[project.scripts]
credit-default = "credit_default.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_default"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "C4"]
ignore = [
    "N803", # sklearn convention: X as an argument name
    "N806", # sklearn convention: X as a variable name
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "lightgbm.*", "mlflow.*", "optuna.*", "shap.*", "evidently.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: trains real models end-to-end (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["credit_default"]
branch = true
