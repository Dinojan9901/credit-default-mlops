name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --only-group dev
      - name: ruff check
        run: uv run --no-sync ruff check src tests scripts
      - name: ruff format --check
        run: uv run --no-sync ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: mypy (strict)
        run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Unit + API tests
        run: uv run --no-sync pytest -m "not slow" --cov --cov-report=term --cov-report=xml
      - name: End-to-end training / registry test
        run: uv run --no-sync pytest -m slow --cov --cov-append --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: credit-default-api:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build trainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: trainer
          push: false
          tags: credit-default-trainer:${{ github.sha }}
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer

  # CD: deploy to an ephemeral kind cluster and smoke-test it. There is no hosted MLflow
  # server (that would cost money), so the job trains a quick model with a throw-away
  # local registry, exports the production version and bakes it into the image - the
  # same path a real pipeline takes, minus the persistent registry.
  deploy-kind:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/ci-mlflow/mlflow.db
      CD_ARTIFACT_ROOT: file://${{ github.workspace }}/ci-mlflow/artifacts
      IMAGE: credit-default-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --extra train
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: uci-credit-default-v1
      - name: Train quick model and register it
        run: |
          mkdir -p ci-mlflow
          uv run --no-sync credit-default train --n-trials 5 --cv-folds 3 --summary-out training_summary.json
        env:
          GIT_COMMIT: ${{ github.sha }}
      - name: Export production model
        run: uv run --no-sync credit-default export-model --alias production --out build/model-export
      - uses: docker/setup-buildx-action@v3
      - name: Build image with baked-in model
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-with-model
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: credit-default
          config: deploy/kind/kind-config.yaml
      - name: Load image into kind
        run: kind load docker-image "$IMAGE" --name credit-default
      - name: Deploy
        run: |
          kubectl apply -k deploy/k8s
          kubectl -n credit-default set image deployment/credit-default-api api="$IMAGE"
          kubectl -n credit-default rollout status deployment/credit-default-api --timeout=240s
          kubectl -n credit-default get pods -o wide
      - name: Smoke test through the NodePort
        run: python scripts/smoke_test.py --url http://localhost:30080 --timeout 120
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n credit-default describe deployment credit-default-api || true
          kubectl -n credit-default describe pods || true
          kubectl -n credit-default logs -l app.kubernetes.io/name=credit-default-api --tail=200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-training-summary
          path: training_summary.json
          if-no-files-found: ignore
